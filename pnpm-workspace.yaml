packages:
  - apps/*
  - packages/*
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  es5-ext: true
  esbuild: true
  msw: true
  sharp: true
catalog:
  '@kubb/adapter-oas': 5.0.0-beta.31
  '@kubb/plugin-client': 5.0.0-beta.31
  '@kubb/plugin-ts': 5.0.0-beta.33
  '@kubb/plugin-zod': 5.0.0-beta.31
  '@size-limit/file': ^12.1.0
  '@types/node': ^22.19.19
  '@vitest/coverage-v8': ^4.1.7
  '@vitest/ui': ^4.1.7
  kubb: 5.0.0-beta.31
  oxfmt: ^0.47.0
  oxlint: ^1.67.0
  'size-limit': ^12.1.0
  tsdown: ^0.22.0
  typescript: ^6.0.3
  vitest: ^4.1.7
minimumReleaseAge: 4320 # 72 hours, matches .npmrc min-package-age
# Native platform bindings are always co-published with their parent package in the same release.
# Excluding them avoids false-positive ERR_PNPM_NO_MATURE_MATCHING_VERSION errors.
minimumReleaseAgeExclude:
  - "@types/*"
  - kubb
  - "@kubb/*"
pmOnFail: warn
resolutionMode: highest
