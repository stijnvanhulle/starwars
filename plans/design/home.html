<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Star Wars characters · Whale Team Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" />
  <style>
    :root {
      --accent-500: #FF348A;
      --accent-600: #E61F75;
      --accent-700: #C01060;
      --accent-50:  #FFF0F6;

      --navy-700: #1E2A8D;
      --navy-800: #152178;

      --nav-bg:     #0F1664;
      --nav-fg:     #FFFFFF;
      --nav-active: #1E2A8D;

      --neutral-0:   #FFFFFF;
      --surface-app: #F5F7FB;
      --neutral-100: #F1F5F9;
      --neutral-200: #E2E8F0;
      --neutral-400: #94A3B8;
      --neutral-600: #334155;
      --neutral-900: #121A52;

      --semantic-error: #DC2626;
      --semantic-error-bg: #FEE2E2;

      --font-head: "Sofia Pro Soft", "Nunito Sans", system-ui, sans-serif;
      --font-body: "Nunito Sans", system-ui, sans-serif;

      --radius-sm:   4px;
      --radius-md:   12px;
      --radius-lg:   16px;
      --radius-pill: 9999px;

      --border-card: 1px solid var(--neutral-200);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      font-weight: 400; font-size: 16px; line-height: 1.5;
      color: var(--neutral-600);
      background: var(--surface-app);
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3 { font-family: var(--font-head); color: var(--neutral-900); margin: 0; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; }
    h1 { font-size: 40px; line-height: 44px; }
    h2 { font-size: 28px; line-height: 36px; }
    h3 { font-size: 18px; line-height: 24px; letter-spacing: -0.01em; }

    /* ---------- Page shell ---------- */

    .shell {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr) 280px;
      min-height: 100vh;
    }
    @media (max-width: 1100px) {
      .shell { grid-template-columns: 80px minmax(0, 1fr); }
      .team-panel { display: none; }
    }

    /* ---------- Left navy nav ---------- */

    .nav {
      background: var(--nav-bg);
      color: var(--nav-fg);
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 0;
      gap: 4px;
      position: sticky; top: 0;
      height: 100vh;
    }
    .nav__brand {
      width: 40px; height: 40px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      color: var(--nav-fg);
      margin-bottom: 16px;
      text-decoration: none;
    }
    .nav__item {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.7);
      cursor: pointer; text-decoration: none;
    }
    .nav__item:hover { background: rgba(255,255,255,0.08); color: var(--nav-fg); }
    .nav__item--active { background: var(--nav-active); color: var(--nav-fg); }
    .nav__spacer { flex: 1; }
    .nav__icon {
      width: 22px; height: 22px;
      stroke: currentColor; stroke-width: 1.75; fill: none;
      stroke-linecap: round; stroke-linejoin: round;
    }

    /* ---------- Main column ---------- */

    .main { display: flex; flex-direction: column; min-width: 0; }

    .topbar {
      position: sticky; top: 0; z-index: 10;
      background: var(--surface-app);
      padding: 16px 32px;
      display: flex; align-items: center; gap: 16px;
      border-bottom: var(--border-card);
    }
    .breadcrumb {
      font-family: var(--font-body); font-weight: 700; font-size: 14px;
      color: var(--neutral-600);
      display: inline-flex; align-items: center; gap: 8px;
    }
    .breadcrumb__sep { color: var(--neutral-400); font-weight: 400; }
    .breadcrumb__current { color: var(--neutral-900); }
    .topbar__spacer { flex: 1; }
    .topbar__team {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      background: var(--neutral-0);
      border: 1.5px solid var(--accent-500);
      color: var(--accent-600);
      font-family: var(--font-body); font-weight: 700; font-size: 14px;
      text-decoration: none;
    }
    .topbar__team:hover { background: var(--accent-50); }
    .topbar__team-count { font-variant-numeric: tabular-nums; color: var(--accent-600); }

    .content { padding: 32px; max-width: 1200px; }

    .page-header { margin-bottom: 32px; max-width: 720px; }
    .page-header__title { margin-bottom: 8px; }
    .page-header__lead { font-size: 16px; line-height: 1.5; color: var(--neutral-600); margin: 0; }

    /* ---------- Character grid ---------- */

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 24px;
    }
    @media (max-width: 1240px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 980px)  { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px)  { .grid { grid-template-columns: 1fr; } }

    .card {
      position: relative;
      display: block;
      background: var(--neutral-0);
      border-radius: var(--radius-lg);
      border: var(--border-card);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }
    .card:hover { border-color: var(--accent-500); }
    .card__media {
      position: relative;
      aspect-ratio: 1 / 1;
      background: var(--neutral-100);
      overflow: hidden;
    }
    .card__media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card__badge {
      position: absolute; top: 12px; left: 12px;
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px;
      background: var(--accent-500);
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-weight: 700; font-size: 11px;
      color: var(--neutral-0);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card__badge--evil { background: var(--semantic-error); }
    .card__body {
      padding: 14px 16px 16px;
      border-top: var(--border-card);
    }
    .card__name {
      font-family: var(--font-head);
      font-weight: 800; font-size: 16px;
      color: var(--neutral-900);
      line-height: 1.2;
      margin: 0 0 4px;
      letter-spacing: -0.01em;
    }
    /* ---------- Right team panel ---------- */

    .team-panel {
      padding: 16px 16px 16px 0;
      position: sticky; top: 0; align-self: start;
      max-height: 100vh; overflow-y: auto;
    }
    .team-panel__card {
      background: var(--neutral-0);
      border: var(--border-card);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .team-panel__header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .team-panel__title {
      font-family: var(--font-head);
      font-weight: 800; font-size: 16px;
      color: var(--neutral-900);
    }
    .team-panel__count {
      font-family: var(--font-body);
      font-weight: 700; font-size: 12px;
      color: var(--accent-600);
      font-variant-numeric: tabular-nums;
      background: var(--accent-50);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
    }
    .roster {
      display: flex; flex-direction: column; gap: 4px;
      list-style: none; padding: 0; margin: 0;
    }
    .roster__item {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      align-items: center; gap: 10px;
      padding: 6px 8px;
      border-radius: var(--radius-md);
    }
    .roster__item:hover { background: var(--neutral-100); }
    .roster__avatar {
      width: 36px; height: 36px;
      border-radius: var(--radius-pill);
      object-fit: cover;
      background: var(--neutral-100);
    }
    .roster__name {
      font-weight: 700; font-size: 13px;
      color: var(--neutral-900); line-height: 1.2;
    }
    .roster__remove {
      width: 24px; height: 24px;
      border-radius: var(--radius-pill);
      border: none; background: transparent;
      color: var(--neutral-400);
      font-size: 13px; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .roster__remove:hover { background: var(--semantic-error-bg); color: var(--semantic-error); }

    .team-panel__cta {
      margin-top: 16px;
      display: block; width: 100%;
      padding: 10px 16px;
      border-radius: var(--radius-pill);
      background: var(--navy-700);
      border: none; color: var(--neutral-0);
      font-family: var(--font-body); font-weight: 700; font-size: 13px;
      text-align: center; text-decoration: none;
    }
    .team-panel__cta:hover { background: var(--navy-800); }
  </style>
</head>
<body>
  <div class="shell">

    <aside class="nav" aria-label="Primary">
      <a class="nav__brand" href="./home.html" aria-label="Whale">
        <svg viewBox="0 0 32 32" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 17c2-5 7-8 13-8s11 3 13 8c-2 5-7 8-13 8s-11-3-13-8z"/>
          <circle cx="12" cy="15" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <a class="nav__item nav__item--active" href="./home.html" aria-label="Characters" aria-current="page">
        <svg class="nav__icon" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      </a>
      <a class="nav__item" href="./team.html" aria-label="Team">
        <svg class="nav__icon" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5"/><path d="M3 20c0-3 2.5-5 6-5s6 2 6 5"/><circle cx="17" cy="10" r="2.5"/><path d="M16 20c0-2 2-3.5 5-3.5"/></svg>
      </a>
    </aside>

    <main class="main">
      <div class="topbar">
        <nav class="breadcrumb" aria-label="Breadcrumb">
          <span class="breadcrumb__current">Characters</span>
        </nav>
      </div>

      <div class="content">
        <header class="page-header">
          <h1 class="page-header__title">Star Wars characters</h1>
          <p class="page-header__lead">Pick five characters for your team. Evil characters can't join.</p>
        </header>

        <section class="grid" aria-label="Character list">
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <span class="card__badge">On team</span>
              <img src="https://akabab.github.io/starwars-api/api/img/1.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Luke Skywalker</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <span class="card__badge">On team</span>
              <img src="https://akabab.github.io/starwars-api/api/img/5.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Leia Organa</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <img src="https://akabab.github.io/starwars-api/api/img/14.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Han Solo</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <img src="https://akabab.github.io/starwars-api/api/img/13.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Chewbacca</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <span class="card__badge card__badge--evil">Dark side</span>
              <img src="https://akabab.github.io/starwars-api/api/img/4.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Darth Vader</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <img src="https://akabab.github.io/starwars-api/api/img/10.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Obi-Wan Kenobi</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <img src="https://akabab.github.io/starwars-api/api/img/20.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">Yoda</h3>
            </div>
          </a>
          <a class="card" href="./character-detail.html">
            <div class="card__media">
              <img src="https://akabab.github.io/starwars-api/api/img/3.jpg" alt="" />
            </div>
            <div class="card__body">
              <h3 class="card__name">R2-D2</h3>
            </div>
          </a>
        </section>
      </div>
    </main>

    <aside class="team-panel" aria-label="Your team">
      <div class="team-panel__card">
        <div class="team-panel__header">
          <span class="team-panel__title">Your team</span>
          <span class="team-panel__count">2 / 5</span>
        </div>
        <ul class="roster">
          <li class="roster__item">
            <img class="roster__avatar" src="https://akabab.github.io/starwars-api/api/img/1.jpg" alt="" />
            <div class="roster__name">Luke Skywalker</div>
            <button class="roster__remove" aria-label="Remove Luke Skywalker">✕</button>
          </li>
          <li class="roster__item">
            <img class="roster__avatar" src="https://akabab.github.io/starwars-api/api/img/5.jpg" alt="" />
            <div class="roster__name">Leia Organa</div>
            <button class="roster__remove" aria-label="Remove Leia Organa">✕</button>
          </li>
        </ul>
        <a class="team-panel__cta" href="./team.html">Manage team</a>
      </div>
    </aside>

  </div>
</body>
</html>
